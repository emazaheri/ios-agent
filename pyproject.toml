[project]
name = "ios-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents drive iOS devices and simulators via XCUIAutomation/WebDriverAgent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anyio>=4.6",
]

[project.optional-dependencies]
vision = ["pillow>=11.0"]

# One repository, three distributions, and the dependencies only ever point
# one way: `ios-tui` -> `ios-agent` -> `ios-mcp`. That is what keeps `ios-mcp`
# usable by any agent rather than only by the one shipped beside it, and what
# keeps `ios-agent` usable by any front end rather than only by this one.
#
# The front end is a separate distribution rather than a subpackage of the
# agent because the agent is held to a seven-module public surface of `ios-mcp`
# (tests/unit/test_layering.py) and a front end needs device discovery and the
# doctor, which are outside it. See docs/adr/0008.
[tool.uv.workspace]
members = ["agent", "tui"]

[tool.uv.sources]
ios-agent = { workspace = true }
ios-mcp = { workspace = true }
ios-tui = { workspace = true }

[project.scripts]
ios-mcp = "ios_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
    "pillow>=12.3.0",
    # Installed for the test run so the eval suite can drive both, not because
    # ios-mcp needs it. Both provider extras are here so the evals can be run
    # against either without a resync; the agent itself commits to none, and
    # `IOS_AGENT_PROVIDER` picks one at runtime.
    "ios-agent[anthropic,openai]",
    # Installed so `tests/tui` can import `ios_tui` without a `pythonpath`
    # entry. The front end is a real distribution, so it is installed like one
    # rather than reached through a path hack.
    "ios-tui",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ios_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run. The device pool and its WebDriverAgent
# subprocesses live across tests, and tearing them down on a different loop
# than the one that created them raises "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Test helper modules (fake_wda, trees, harness, flows) live beside the tests
# that use them rather than in the package.
pythonpath = ["tests", "tests/evals", "tests/evals/agent", "tests/tui"]
markers = [
    "simulator: requires a booted iOS Simulator (skipped when unavailable)",
    "device: requires an attached physical iPhone (skipped when unavailable)",
    "eval: golden-flow evaluation, slow",
    "agent: goal-directed agent evaluation against a scripted device",
    "device_state: configures the scripted device for one MCP-backend test",
    "model: calls a real model, needs credentials and costs money",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
