[project]
name = "ios-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents drive iOS devices and simulators via XCUIAutomation/WebDriverAgent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anyio>=4.6",
]

[project.optional-dependencies]
vision = ["pillow>=11.0"]

[project.scripts]
ios-mcp = "ios_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ios_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "simulator: requires a booted iOS Simulator (skipped when unavailable)",
    "device: requires an attached physical iPhone (skipped when unavailable)",
    "eval: golden-flow evaluation, slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
