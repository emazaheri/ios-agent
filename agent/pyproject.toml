[project]
name = "ios-agent"
version = "0.1.0"
description = "A goal-directed agent that drives an iPhone through the ios-mcp library"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Depends on ios-mcp, never the reverse. That direction is the whole point of
# the split: the server must stay usable by any agent, so it cannot carry a
# dependency on this one or on a model provider.
dependencies = [
    "ios-mcp",
    "langgraph>=1.2",
    "langchain>=1.3",
]

# The provider is configuration, not a dependency. The loop builds its model
# through `init_chat_model`, so the base install commits to no vendor and
# `IOS_AGENT_PROVIDER` picks one at runtime. Install the extra that matches.
[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.6"]
openai = ["langchain-openai>=1.6"]
google_genai = ["langchain-google-genai>=4.3"]
google_vertexai = ["langchain-google-vertexai>=3.2"]
ollama = ["langchain-ollama>=1.1"]
groq = ["langchain-groq>=1.1"]
mistralai = ["langchain-mistralai>=1.1"]
bedrock_converse = ["langchain-aws>=1.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ios_agent"]
