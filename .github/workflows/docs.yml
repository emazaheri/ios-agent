name: Docs

# Builds the Starlight site in site/ from the repository's Markdown and
# publishes it to GitHub Pages. A pull request builds without deploying, which
# is where a broken link fails: the build validates every internal one.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - "agent/README.md"
      - "tui/README.md"
      - ".env.example"
      - "site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - "agent/README.md"
      - "tui/README.md"
      - ".env.example"
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs `npm ci` and `npm run build` in site/, which syncs the Markdown
      # first, then uploads dist/ as the Pages artifact.
      - uses: withastro/action@v6
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
