name: Release

# Tags only. A release is a deliberate act, so nothing here is reachable from
# an ordinary push, and the tag is what names the artifact.
on:
  push:
    tags: ["v*"]

# No token lives anywhere. PyPI Trusted Publishing mints a short-lived OIDC
# credential for this workflow in this repository, which is the difference
# between a secret that can leak and one that does not exist.
permissions:
  contents: read

jobs:
  # The tag says 0.2.0 and every file has to agree. `test_version.py` checks
  # the files against each other; only this can check them against the tag,
  # because only here is the tag a fact.
  verify:
    name: gates and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `--locked` because a plain sync silently rewrites the lock and carries
      # on, which is how a stale one reached main: every job went green against
      # a lockfile it had just corrected. See tests/unit/test_version.py.
      # A release is exactly the change most likely to leave the lock behind,
      # since bumping a workspace member's version restates it in `uv.lock`.
      - name: the lockfile is current
        run: uv lock --check

      - run: uv sync --locked

      - name: the tag matches the packages
        run: |
          tag="${GITHUB_REF_NAME#v}"
          have=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  pyproject=$have"
          test "$tag" = "$have"

      - name: lint and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy ios_mcp agent/ios_agent tui/ios_tui

      - name: offline tests
        run: uv run pytest tests/unit tests/tui -q

      # The same free series CI guards, so a release cannot ship a route whose
      # cost moved without someone recording it.
      - name: eval floors
        run: |
          uv run pytest tests/evals/agent -m "agent and not model" -q
          uv run python scripts/eval_trend.py check .artifacts/evals/agent.json --suite agent-oracle

  publish:
    name: build and publish ios-mcp
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC credential, and nothing else
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The root distribution only. `ios-agent` and `ios-tui` carry
      # `Private :: Do Not Upload`, so PyPI would refuse them anyway, but
      # naming the package keeps the intent in the workflow rather than in a
      # classifier someone has to go and read.
      - run: uv build --package ios-mcp

      - uses: pypa/gh-action-pypi-publish@release/v1

  # The MCP registry entry, which pointed at 0.1.1 through five releases
  # because publishing it was a manual step that needed a person's GitHub
  # login. The registry accepts this workflow's OIDC token as proof of the
  # io.github.emazaheri namespace, so, like PyPI, no secret exists to leak.
  #
  # After PyPI, because the registry checks the package is there and that its
  # published README carries the `mcp-name:` line before it lists anything.
  registry:
    name: publish to the MCP registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # the OIDC credential
      contents: read
    env:
      # Pinned, and checked against the checksum the release publishes. The
      # registry's own example fetches whatever is latest, which would run an
      # unreviewed binary holding this job's credential. Bump both together.
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4

      - name: install mcp-publisher
        run: |
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum --check
          tar xzf publisher.tar.gz mcp-publisher

      # PyPI's JSON for a new version can lag the upload by a little.
      - name: wait for PyPI to serve this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 30); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/ios-mcp/${version}/json" && exit 0
            sleep 10
          done
          echo "PyPI never served ios-mcp ${version}" >&2
          exit 1

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  # Last, and only if PyPI accepted the upload. A GitHub Release is an
  # announcement, and announcing a version nobody can install is the same
  # mistake as a registry manifest pointing at one, which cost 0.1.1.
  #
  # A separate job because of the permission: this one needs `contents: write`
  # to create the release, and the job holding the OIDC credential should not
  # also be able to write to the repository.
  announce:
    name: github release
    needs: registry   # which needs publish: announce only what can be installed and found
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release, and nothing else
    steps:
      # The tag, and enough history to read the commit it points at.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The notes are the release commit's own body. Every release here is
      # written up as prose in the commit that moves the version, so
      # generating a list of commit subjects instead would replace something
      # someone wrote with something nobody did.
      - name: create the release from the commit that made it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%b "$GITHUB_REF_NAME" > notes.md
          title="$(git log -1 --format=%s "$GITHUB_REF_NAME")"
          test -s notes.md || { echo "the release commit has no body to publish" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
